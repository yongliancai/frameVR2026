# 掛在既有網站子路徑用的 Nginx 設定（例如 https://nckuchat.online/framevr/）
# setup-vps.sh 會把 __BASE_PATH__、__PORT__ 換掉，存成 /etc/nginx/snippets/framevr2026.conf，
# 並在網站的 server { ... } 區塊裡加一行：include snippets/framevr2026.conf;
# 對應 .env 的 BASE_PATH 與 PORT。手動設定時把 __BASE_PATH__ 換成 /framevr、__PORT__ 換成 3060。

location __BASE_PATH__/ {
    proxy_pass         http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 512k;
    proxy_read_timeout 30s;
}

location = __BASE_PATH__ {
    return 301 __BASE_PATH__/;
}
